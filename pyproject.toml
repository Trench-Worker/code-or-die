[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quiz-cli"
version = "0.1.0"
description = "code-or-die — a beginner-friendly Python quiz CLI loaded from JSON"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Trench-Worker" }]
keywords = ["code-or-die", "quiz", "cli", "education", "argparse", "pathlib"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
quiz-cli = "quiz_cli.quiz:cli"

[project.urls]
Homepage = "https://github.com/Trench-Worker/code-or-die"
Repository = "https://github.com/Trench-Worker/code-or-die"
Issues = "https://github.com/Trench-Worker/code-or-die/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
